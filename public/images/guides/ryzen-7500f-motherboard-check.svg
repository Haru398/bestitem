<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">라이젠 7500F 메인보드 호환성 확인 순서</title>
  <desc id="desc">AM5 소켓, 칩셋, CPU 지원표와 BIOS, DDR5 메모리, 확장 포트를 차례로 확인하는 자체 제작 도식</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17231c"/>
      <stop offset="1" stop-color="#23392c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#09120c" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1390" cy="110" r="260" fill="#f16b43" opacity=".12"/>
  <circle cx="150" cy="820" r="300" fill="#87b995" opacity=".10"/>

  <text x="92" y="112" fill="#ffb69f" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="26" font-weight="700" letter-spacing="4">COMPATIBILITY CHECK</text>
  <text x="92" y="184" fill="#ffffff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="58" font-weight="800">라이젠 7500F 메인보드 확인 순서</text>
  <text x="92" y="232" fill="#c6d5ca" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25">소켓이 맞아도 CPU 지원표와 BIOS까지 확인해야 조립 전에 호환성을 판단할 수 있습니다.</text>

  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans KR', sans-serif">
    <g transform="translate(92 314)">
      <rect width="264" height="300" rx="28" fill="#fffdf8"/>
      <text x="28" y="54" fill="#de5d38" font-size="22" font-weight="800">01</text>
      <text x="28" y="112" fill="#17231c" font-size="31" font-weight="800">AM5 소켓</text>
      <text x="28" y="161" fill="#526056" font-size="20">7500F의 물리 규격</text>
      <path d="M62 210h140v56H62z" fill="none" stroke="#315e43" stroke-width="8"/>
      <path d="M78 226h108v24H78z" fill="#d9eadf"/>
    </g>
    <path d="M372 464h54" stroke="#7faa8c" stroke-width="6" stroke-linecap="round"/>
    <path d="m418 450 16 14-16 14" fill="none" stroke="#7faa8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(442 314)">
      <rect width="264" height="300" rx="28" fill="#fffdf8"/>
      <text x="28" y="54" fill="#de5d38" font-size="22" font-weight="800">02</text>
      <text x="28" y="112" fill="#17231c" font-size="31" font-weight="800">칩셋 선택</text>
      <text x="28" y="161" fill="#526056" font-size="20">A620 또는 B650 등</text>
      <rect x="57" y="206" width="150" height="64" rx="12" fill="#315e43"/>
      <text x="132" y="247" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">I/O</text>
    </g>
    <path d="M722 464h54" stroke="#7faa8c" stroke-width="6" stroke-linecap="round"/>
    <path d="m768 450 16 14-16 14" fill="none" stroke="#7faa8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(792 314)">
      <rect width="324" height="300" rx="28" fill="#fffdf8"/>
      <text x="28" y="54" fill="#de5d38" font-size="22" font-weight="800">03</text>
      <text x="28" y="112" fill="#17231c" font-size="31" font-weight="800">CPU 지원표 · BIOS</text>
      <text x="28" y="161" fill="#526056" font-size="20">보드 모델별 지원 여부</text>
      <rect x="53" y="205" width="218" height="65" rx="12" fill="#e5eee7"/>
      <path d="m82 239 18 18 38-45" fill="none" stroke="#de5d38" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M161 226h78M161 250h58" stroke="#315e43" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M1132 464h54" stroke="#7faa8c" stroke-width="6" stroke-linecap="round"/>
    <path d="m1178 450 16 14-16 14" fill="none" stroke="#7faa8c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1202 314)">
      <rect width="306" height="300" rx="28" fill="#fffdf8"/>
      <text x="28" y="54" fill="#de5d38" font-size="22" font-weight="800">04</text>
      <text x="28" y="112" fill="#17231c" font-size="31" font-weight="800">DDR5 · 확장성</text>
      <text x="28" y="161" fill="#526056" font-size="20">메모리와 M.2·USB</text>
      <rect x="50" y="207" width="206" height="60" rx="10" fill="#315e43"/>
      <path d="M77 221v32M108 221v32M139 221v32M170 221v32M201 221v32" stroke="#b9d7c3" stroke-width="7"/>
    </g>
  </g>

  <g transform="translate(92 702)" font-family="Arial, 'Noto Sans KR', sans-serif">
    <rect width="1416" height="106" rx="24" fill="#0e1711" opacity=".7"/>
    <text x="34" y="43" fill="#ffb69f" font-size="20" font-weight="800">핵심</text>
    <text x="34" y="76" fill="#ffffff" font-size="24" font-weight="700">칩셋 이름만으로 특정 메인보드의 BIOS, 포트 수, 슬롯 공유 조건까지 확정할 수는 없습니다.</text>
  </g>
</svg>
