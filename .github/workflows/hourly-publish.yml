name: Publish one scheduled product guide

on:
  # AdSense 재심사 준비 기간에는 자동 상품 발행을 중지합니다.
  # 품질 보류를 해제한 뒤에도 먼저 workflow_dispatch의 check를 통과해야 합니다.
  # main의 일반 편집은 품질 게이트를 통과한 현재 사이트만 배포하며 예약 글을 꺼내지 않습니다.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'check는 큐 확인, publish는 승인된 글 1개 공개, deploy는 현재 검증된 사이트만 재배포합니다.'
        required: true
        default: check
        type: choice
        options:
          - check
          - publish
          - deploy

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: item-monster-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the complete reservation queue
        run: node scripts/schedule/validate-queue.cjs --count=$(node -p "require('./content/scheduled/queue.json').items.length")

      - name: Reject near-duplicate reserved articles
        run: npm run schedule:similarity

      - name: Check next reservation without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
        run: node scripts/schedule/release-next.cjs --dry-run

      - name: Release exactly one reservation
        id: release
        if: ${{ inputs.mode == 'publish' }}
        run: node scripts/schedule/release-next.cjs

      - name: Validate public content
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        run: npm run content:validate

      - name: Enforce AdSense editorial quality gate
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        run: npm run content:adsense-audit

      - name: Build static site
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        run: npx next build --webpack

      - name: Verify sitemap
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        run: npm run sitemap:verify

      - name: Verify latest-content RSS
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        run: npm run rss:verify

      - name: Commit actual publication time and remaining queue
        if: ${{ steps.release.outputs.released == 'true' }}
        env:
          RELEASED_SLUG: ${{ steps.release.outputs.slug }}
          RELEASED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          git config user.name "item-monster-publisher[bot]"
          git config user.email "item-monster-publisher[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish scheduled guide: ${RELEASED_SLUG} at ${RELEASED_AT}"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        uses: actions/configure-pages@v5

      - name: Upload static Pages artifact
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy the same verified artifact
        if: ${{ github.event_name == 'push' || steps.release.outputs.released == 'true' || inputs.mode == 'deploy' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Disable this hourly workflow after the final reserved article
        if: ${{ steps.release.outputs.released == 'true' && steps.release.outputs.remaining == '0' }}
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'hourly-publish.yml'
            })
